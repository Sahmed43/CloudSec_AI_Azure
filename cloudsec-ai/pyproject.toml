[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "cloudsec-ai"
version = "0.1.0"
description = "Azure OpenAI-assisted security event triage with deterministic detection"
requires-python = ">=3.10"
dependencies = ["openai>=1.30,<3", "pandas>=2.0,<3", "streamlit>=1.35,<2", "python-dotenv>=1.0,<2"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]
[project.scripts]
cloudsec = "cloudsec.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
